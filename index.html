const rendered = new Set();
const panels = document.getElementById('panels');
function esc(s){return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function abbr(col){return String(col).replace('2a e 4a: ','2/4 ').replace('3a e 5a: ','3/5 ').replace('6a: ','6ª ');}
function rateClass(v){if(v>=90)return 'crit'; if(v>=60)return 'high'; if(v>=30)return 'mid'; return 'low';}
function barColor(v){if(v>=80)return 'linear-gradient(90deg,#ef4444,#f97316)'; if(v>=50)return 'linear-gradient(90deg,#f59e0b,#fbbf24)'; return 'linear-gradient(90deg,var(--blue),var(--sky))';}
function renderPanel(turno){
 if(rendered.has(turno)) return;
 const d = DATA[turno], m = d.metrics;
 const panel = document.createElement('section'); panel.className='panel'; panel.id='panel-'+turno;
 let html = `<div class="cards"><div class="card blue"><small>Taxa Geral de Ocupação</small><b>${m.taxaGeral.toFixed(1)}%</b></div><div class="card teal"><small>Slots Ocupados</small><b>${m.slotsOcupados}</b></div><div class="card gold"><small>Slots Disponíveis</small><b>${m.slotsDisponiveis}</b></div><div class="card purple"><small>Espaços Ensalados</small><b>${m.espacos}</b></div></div>`;
 html += `<div class="progressBox"><div class="progressLine"><span>Ocupação geral do turno</span><span>${m.taxaGeral.toFixed(1)}%</span></div><div class="track"><div class="bar" style="width:${m.taxaGeral}%;background:${barColor(m.taxaGeral)}"></div></div></div>`;
 html += `<div class="tableWrap"><table class="occTable"><thead><tr><th class="local">LOCAL</th><th>Taxa Local</th><th>Cap.</th>`;
 d.timeColumns.forEach(c => html += `<th title="${esc(c)}">${esc(abbr(c))}</th>`);
 html += `</tr></thead><tbody>`;
 d.rows.forEach(r => { html += `<tr><td class="local">${esc(r.LOCAL)}</td><td class="rate"><span class="rateBadge ${rateClass(r['Taxa Local'])}">${Number(r['Taxa Local']).toFixed(1)}%</span></td><td class="cap">${r.CAPMAXESP}</td>`; d.timeColumns.forEach(c => { const val = r[c]; html += `<td>${val ? `<span class="chip" title="${esc(val)}">${esc(val)}</span>` : ''}</td>`; }); html += `</tr>`; });
 html += `</tbody></table></div><div class="legend"><span><i class="dot" style="background:#bbf7d0"></i>0–29% baixa</span><span><i class="dot" style="background:#fde68a"></i>30–59% moderada</span><span><i class="dot" style="background:#fed7aa"></i>60–89% alta</span><span><i class="dot" style="background:#fecaca"></i>≥90% crítica</span></div>`;
 panel.innerHTML = html; panels.appendChild(panel); rendered.add(turno);
}
function activate(turno){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.turno===turno));renderPanel(turno);document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById('panel-'+turno).classList.add('active');}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>activate(b.dataset.turno)));
activate('Matutino');
function _norm(s){return String(s==null?"":s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();}
function aplicarBusca(){
 var q=_norm((document.getElementById("busca")||{}).value||"");
 document.querySelectorAll(".panel.active .occTable tbody tr").forEach(function(tr){
  var chips=tr.querySelectorAll(".chip");
  chips.forEach(function(c){c.classList.remove("hit");});
  if(!q){tr.classList.remove("oculta");return;}
  var local=_norm(tr.querySelector("td.local")?tr.querySelector("td.local").textContent:"");
  var achou=local.indexOf(q)>=0, achouChip=false;
  chips.forEach(function(c){ if(_norm(c.textContent).indexOf(q)>=0){c.classList.add("hit");achouChip=true;} });
  tr.classList.toggle("oculta", !(achou||achouChip));
 });
 var p=document.querySelector(".panel.active .tableWrap");
 if(p){var vis=p.querySelectorAll("tbody tr:not(.oculta)").length;
  var msg=p.parentNode.querySelector(".semres");
  if(!vis&&!msg){var d=document.createElement("div");d.className="semres";
   d.textContent="Nenhum espaço ou disciplina corresponde à busca.";p.parentNode.insertBefore(d,p.nextSibling);}
  else if(vis&&msg){msg.remove();}}
}
/* ── Relatório institucional paginado do turno em tela ───────── */
function _linhasTurno(turno){
 var d=DATA[turno]; if(!d) return [];
 var out=[];
 d.rows.forEach(function(r){
  d.timeColumns.forEach(function(col,idx){
   var v=String(r[col]||"").trim();
   if(!v) return;
   out.push({ local:r.LOCAL, cap:r.CAPMAXESP, taxa:r["Taxa Local"], col:col, ordem:idx, txt:v });
  });
 });
 out.sort(function(a,b){
  return String(a.local).localeCompare(String(b.local),"pt-BR",{numeric:true}) || a.ordem-b.ordem;
 });
 return out;
}
function imprimirOcupacao(){
 var turno=(document.querySelector(".tab.active")||{}).dataset;
 turno=turno?turno.turno:"Matutino";
 var linhas=_linhasTurno(turno);
 if(!linhas.length){ alert("Nenhuma ocupação neste turno."); return; }
 var blocos=[], atualLoc=null;
 linhas.forEach(function(l){
  if(l.local!==atualLoc){ atualLoc=l.local;
   blocos.push({tipo:"loc", local:l.local, cap:l.cap, taxa:l.taxa}); }
  blocos.push({tipo:"aula", l:l});
 });
 var POR=26, pgs=[], atual=[];
 blocos.forEach(function(b){ if(atual.length>=POR){ pgs.push(atual); atual=[]; } atual.push(b); });
 if(atual.length) pgs.push(atual);
 var ag=new Date();
 var esc=function(t){ return String(t==null?"":t)
   .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); };
 var linhaHTML=function(b){
  if(b.tipo==="loc") return "<tr class='rel-loc'><td colspan='4'>"+esc(b.local)
    +"  ·  capacidade "+esc(b.cap)+"  ·  ocupação "+esc(b.taxa)+"%</td></tr>";
  var partes=String(b.l.col).split(":");
  return "<tr><td class='rel-nowrap'>"+esc(partes[0])+"</td>"
   +"<td class='rel-nowrap'>"+esc((partes[1]||"").trim())+"</td>"
   +"<td class='j'>"+esc(b.l.txt)+"</td>"
   +"<td class='rel-nowrap'>"+esc(b.l.local)+"</td></tr>";
 };
 var total=pgs.length;
 document.getElementById("relatorio").innerHTML=pgs.map(function(pg,i){
  return "<div class='rel-pg'><div class='rel-vazio'></div>"
   +"<div class='rel-hdr'><img src='"+LOGO_UFAM+"' alt='UFAM'>"
   +"<div class='ctr'><h1>Ocupação dos Espaços da Faculdade de Tecnologia</h1>"
   +"<h2>COPEN-FT · "+esc(SEMESTRE)+" · "+esc(VERSAO)+" · Turno "+esc(turno)+"</h2>"
   +"<div class='obs'>Dúvidas: procurar Luiz Fernando (LIFT II, Pavilhão Rio Canumã) "
   +"ou os chefes/coordenadores do seu curso</div>"
   +"<div class='rel-vazio' style='height:3mm'></div></div>"
   +"<img class='dir' src='"+LOGO_FT+"' alt='FT'></div>"
   +"<div class='rel-card'><div class='rel-card-h'>"
   +"<div class='t'>Turno "+esc(turno)+"</div>"
   +"<div class='n'>"+DATA[turno].metrics.espacos+" espaço(s) · taxa geral "
   +DATA[turno].metrics.taxaGeral+"%</div></div>"
   +"<table><colgroup><col style='width:14%'><col style='width:13%'>"
   +"<col style='width:52%'><col style='width:21%'></colgroup>"
   +"<thead><tr><th>Dias</th><th>Horário</th><th>Disciplina · Turma</th><th>Local</th></tr></thead>"
   +"<tbody>"+pg.map(linhaHTML).join("")+"</tbody></table>"
   +"<div class='rel-rod'><span>Gerado em "+ag.toLocaleDateString("pt-BR")+" às "
   +ag.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})+"</span>"
   +"<span>Página "+(i+1)+" de "+total+"</span></div></div>"
   +(i===total-1
     ? "<div class='rel-qr'><div class='tit'>Avalie o Ensalamento ou envie sugestões pelo QR abaixo</div>"
       +"<div class='row'><img src='"+LOGO_COPEN+"' alt='COPEN-FT'>"
       +"<a href='"+LINK_AVAL+"' target='_blank' rel='noopener'>"
       +"<img src='"+QR_AVAL+"' alt='Avalie o ensalamento'></a></div>"
       +"<div class='lnk'>"+LINK_AVAL+"</div></div>"
     : "")
   +"</div>";
 }).join("");
 var t0=document.title;
 document.title="ocupacao_"+String(turno).toLowerCase()+"_"+String(SEMESTRE).replace("/","-");
 setTimeout(function(){ window.print(); setTimeout(function(){ document.title=t0; },800); },150);
}
var _b=document.getElementById("busca");
if(_b){_b.addEventListener("input",aplicarBusca);}
document.querySelectorAll(".tab").forEach(function(b){b.addEventListener("click",function(){setTimeout(aplicarBusca,0);});});
/* Contador de acessos — distingue dispositivos por identificador local */
(function(){
 var el=document.getElementById("contador"); if(!el) return;
 var base=(typeof DB_PAINEL!=="undefined")?DB_PAINEL:"";
 var id  =(typeof PAINEL_ID!=="undefined")?PAINEL_ID:"painel";
 var no  = base+"/painel_acessos/"+id;
 var dev=null;
 try{ dev=localStorage.getItem("pen_painel_dispositivo");
  if(!dev){ dev="d"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
   localStorage.setItem("pen_painel_dispositivo",dev); } }
 catch(e){ dev="anon"+Math.random().toString(36).slice(2,8); }
 function mostrar(disp,vis){
  el.textContent="👁 "+vis+(vis===1?" acesso":" acessos")+" · "+disp+(disp===1?" dispositivo":" dispositivos");
 }
 if(!base){ el.textContent=""; return; }
 fetch(no+"/"+dev+".json").then(function(r){return r.json();}).then(function(a){
  var n=(a&&a.visitas?a.visitas:0)+1;
  return fetch(no+"/"+dev+".json",{method:"PUT",body:JSON.stringify({
   visitas:n, ultimo:new Date().toISOString(),
   tela:(screen.width+"x"+screen.height),
   ua:String(navigator.userAgent||"").slice(0,140)})});
 }).then(function(){ return fetch(no+".json"); })
  .then(function(r){return r.json();}).then(function(todos){
   var disp=0, vis=0;
   if(todos&&typeof todos==="object"){
    Object.keys(todos).forEach(function(k){ disp++; vis+=(todos[k]&&todos[k].visitas)||0; });
   }
   mostrar(disp||1, vis||1);
  }).catch(function(){ el.textContent="👁 contador de acessos indisponível no momento"; });
})();
